name: Daily AI Prompt Radar

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "config/**"
      - "tests/**"
      - ".github/workflows/daily.yml"
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-ai-prompt-radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Collect and rank prompts
        env:
          RADAR_MIN_SCORE: "28"
          RADAR_MAX_ITEMS: "50"
        run: python -m src.prompt_radar

      - name: Commit daily archive
        run: |
          if [ -z "$(git status --porcelain -- archive data)" ]; then
            echo "No new archive changes."
            exit 0
          fi
          git config user.name "ai-prompt-radar[bot]"
          git config user.email "ai-prompt-radar[bot]@users.noreply.github.com"
          git add archive data
          git commit -m "archive: update daily AI prompts"
          git push
